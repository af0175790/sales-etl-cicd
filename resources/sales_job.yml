# resources/sales_job.yml
# One job, three chained tasks = the Medallion pipeline.
# No cluster block anywhere -> Databricks runs each task on SERVERLESS
# compute, which is the only compute type Free Edition offers.

resources:
  jobs:
    sales_etl_job:
      name: "sales-etl-${bundle.target}"

      tasks:
        - task_key: bronze_ingestion
          notebook_task:
            notebook_path: ../src/bronze_ingestion.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              raw_path: ${var.raw_path}

        - task_key: silver_transformation
          depends_on:
            - task_key: bronze_ingestion
          notebook_task:
            notebook_path: ../src/silver_transformation.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: gold_sales_summary
          depends_on:
            - task_key: silver_transformation
          notebook_task:
            notebook_path: ../src/gold_sales_summary.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
